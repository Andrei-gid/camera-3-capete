# Screen-records luxcam.md/?ad=ztv and ?ad=th3 (ad mode: only the block, clean
# screen) in real time with Chrome on a virtual display, 9:16 and 1:1, and
# pushes the mp4 files to the branch "ad-videos-out".
name: record-ads
on:
  push:
    branches: [record-ads]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Record
        run: |
          set -e
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq xvfb ffmpeg fonts-noto-color-emoji >/dev/null
          if ! command -v google-chrome >/dev/null; then
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y -qq ./google-chrome-stable_current_amd64.deb >/dev/null
          fi
          google-chrome --version; ffmpeg -version | head -1
          mkdir -p /tmp/out
          rec () { # block W H dsf name
            Xvfb :99 -screen 0 ${2}x${3}x24 -nolisten tcp >/dev/null 2>&1 &
            XP=$!; sleep 2
            rm -rf /tmp/prof && mkdir -p /tmp/prof/Default
            echo '{"translate":{"enabled":false},"translate_blocked_languages":["ro","en"],"intl":{"accept_languages":"ro,en"}}' > /tmp/prof/Default/Preferences
            WW=$(python3 -c "print(round($2/$4))"); WH=$(python3 -c "print(round($3/$4))")
            DISPLAY=:99 google-chrome --no-first-run --no-default-browser-check --disable-infobars \
              --kiosk --lang=ro --window-position=0,0 --window-size=$WW,$WH --force-device-scale-factor=$4 \
              --user-data-dir=/tmp/prof --autoplay-policy=no-user-gesture-required --hide-scrollbars \
              --disable-features=Translate,TranslateUI --disable-gpu-vsync --password-store=basic \
              "https://luxcam.md/?ad=$1" >/dev/null 2>&1 &
            CP=$!
            sleep 12
            ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -framerate 30 -video_size ${2}x${3} -i :99 -t 15.5 \
              -c:v libx264 -preset slow -crf 16 -pix_fmt yuv420p -movflags +faststart /tmp/out/$5.mp4
            kill $CP || true; sleep 1; kill $XP || true; sleep 1
            ffmpeg -y -loglevel error -ss 7 -i /tmp/out/$5.mp4 -frames:v 1 -vf scale=360:-1 /tmp/out/$5-preview.jpg
          }
          rec ztv 1080 1920 2.5 vezi-diferenta-9x16-reels
          rec th3 1080 1920 2.5 trei-capete-9x16-reels
          rec ztv 1080 1080 1   vezi-diferenta-1x1
          rec th3 1080 1080 1   trei-capete-1x1
          ls -la /tmp/out
      - name: Push results
        run: |
          cd /tmp/out
          git init -q -b ad-videos-out
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add . && git commit -qm "Ad videos from luxcam.md"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ad-videos-out
