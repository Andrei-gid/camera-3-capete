# Records the two comparison blocks of luxcam.md as Facebook ad videos
# (1:1 and 9:16) and pushes the mp4 files to the branch "ad-videos-out".
# Runs only when the branch "record-ads" is pushed.
name: record-ads
on:
  push:
    branches: [record-ads]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          cp $GITHUB_WORKSPACE/scripts/record-ads.mjs /tmp/pw/
      - name: Record frames
        run: cd /tmp/pw && node record-ads.mjs
      - name: Encode videos
        run: |
          set -e
          BG=$GITHUB_WORKSPACE/public/images/blue-abstract-bg.jpg
          mkdir -p /tmp/out
          enc () { # frames-dir out-name W H
            W=$3; H=$4; FW=$((W-60)); FH=$((H-60))
            ffmpeg -y -loglevel error -loop 1 -i "$BG" -framerate 30 -i "/tmp/pw/frames/$1/f%05d.png" \
              -filter_complex "[0]scale=$W:$H:force_original_aspect_ratio=increase,crop=$W:$H,setsar=1[bg];[1]scale=$FW:$FH:force_original_aspect_ratio=decrease:flags=lanczos[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2:shortest=1,format=yuv420p" \
              -c:v libx264 -preset slow -crf 17 -r 30 -movflags +faststart "/tmp/out/$2.mp4"
            ffmpeg -y -loglevel error -ss 6 -i "/tmp/out/$2.mp4" -frames:v 1 "/tmp/out/$2-preview.jpg"
          }
          for b in vezi-diferenta trei-capete; do
            enc "$b-mobile"  "$b-9x16-reels" 1080 1920
            enc "$b-desktop" "$b-1x1"        1080 1080
            enc "$b-mobile"  "$b-1x1-vertical-layout" 1080 1080
          done
          ls -la /tmp/out
      - name: Push results
        run: |
          cd /tmp/out
          git init -q -b ad-videos-out
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add . && git commit -qm "Ad videos from luxcam.md"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ad-videos-out
